name: Internal APK release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "remote-config/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      installed_certificate_sha256:
        description: "Current installed APK certificate SHA-256 (required for the first release)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: internal-apk-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INTERNAL_KEYSTORE_PASSWORD: ${{ secrets.INTERNAL_KEYSTORE_PASSWORD }}
      INTERNAL_KEY_ALIAS: ${{ secrets.INTERNAL_KEY_ALIAS }}
      INTERNAL_KEY_PASSWORD: ${{ secrets.INTERNAL_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore internal signing key
        env:
          INTERNAL_KEYSTORE_BASE64: ${{ secrets.INTERNAL_KEYSTORE_BASE64 }}
        run: |
          test -n "$INTERNAL_KEYSTORE_BASE64"
          test -n "$INTERNAL_KEYSTORE_PASSWORD"
          test -n "$INTERNAL_KEY_ALIAS"
          test -n "$INTERNAL_KEY_PASSWORD"
          INTERNAL_KEYSTORE_FILE="$RUNNER_TEMP/internal.keystore"
          printf '%s' "$INTERNAL_KEYSTORE_BASE64" | base64 --decode > "$INTERNAL_KEYSTORE_FILE"
          chmod 600 "$INTERNAL_KEYSTORE_FILE"
          echo "INTERNAL_KEYSTORE_FILE=$INTERNAL_KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Resolve one build identity
        run: |
          echo "XR_BUILD_EPOCH_SECONDS=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Validate runtime manifest
        run: python3 scripts/validate_remote_manifest.py

      - name: Verify trusted signing identity
        env:
          BOOTSTRAP_INSTALLED_CERT_SHA256: ${{ inputs.installed_certificate_sha256 }}
        run: |
          KEYSTORE_OUTPUT="$(keytool -list -v \
            -keystore "$INTERNAL_KEYSTORE_FILE" \
            -storepass "$INTERNAL_KEYSTORE_PASSWORD" \
            -alias "$INTERNAL_KEY_ALIAS")"
          KEYSTORE_CERT_SHA256="$(printf '%s\n' "$KEYSTORE_OUTPUT" \
            | sed -n 's/^[[:space:]]*SHA256: //p' \
            | tr '[:upper:]' '[:lower:]' \
            | tr -d ': ')"
          test -n "$KEYSTORE_CERT_SHA256"
          PREVIOUS_CERT="$(jq -r '.release.signingCertificateSha256 // empty' remote-config/internal/manifest.json)"
          EXPECTED_CERT="$PREVIOUS_CERT"
          if [ -z "$EXPECTED_CERT" ]; then
            EXPECTED_CERT="$(printf '%s' "$BOOTSTRAP_INSTALLED_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ': ')"
          fi
          if [ -z "$EXPECTED_CERT" ]; then
            echo "First release is blocked until workflow_dispatch supplies the current installed APK certificate SHA-256." >&2
            exit 1
          fi
          if [ "$EXPECTED_CERT" != "$KEYSTORE_CERT_SHA256" ]; then
            echo "Configured keystore does not match the trusted installed APK certificate." >&2
            exit 1
          fi
          echo "EXPECTED_SIGNING_CERT_SHA256=$EXPECTED_CERT" >> "$GITHUB_ENV"

      - name: Build signed internal APK
        run: ./gradlew :app:assembleDebug

      - name: Inspect and publish release asset
        id: release
        run: |
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          APK_PATH="$RUNNER_TEMP/xr-stream-internal.apk"
          cp "$SOURCE_APK" "$APK_PATH"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          APK_BADGING="$($AAPT dump badging "$APK_PATH")"
          PACKAGE_LINE="$(printf '%s\n' "$APK_BADGING" | sed -n '1p')"
          PACKAGE_NAME="$(printf '%s' "$PACKAGE_LINE" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p")"
          VERSION_CODE="$(printf '%s' "$PACKAGE_LINE" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          VERSION_NAME="$(printf '%s' "$PACKAGE_LINE" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          GIT_SHA="$(git rev-parse --short HEAD)"
          test "$PACKAGE_NAME" = "blackark.app.vr"
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          test -n "$GIT_SHA"

          APK_NAME="xr-stream-internal-${VERSION_CODE}.apk"
          FINAL_APK_PATH="$RUNNER_TEMP/$APK_NAME"
          mv "$APK_PATH" "$FINAL_APK_PATH"
          APK_PATH="$FINAL_APK_PATH"
          APK_SIZE="$(stat -c%s "$APK_PATH")"
          APK_SHA256="$(sha256sum "$APK_PATH" | awk '{print tolower($1)}')"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          APKSIGNER_OUTPUT="$($APKSIGNER verify --print-certs "$APK_PATH")"
          SIGNING_CERT_SHA256="$(printf '%s\n' "$APKSIGNER_OUTPUT" | awk -F': ' '/Signer #1 certificate SHA-256 digest/{print tolower($2)}')"
          test -n "$SIGNING_CERT_SHA256"

          if [ "$EXPECTED_SIGNING_CERT_SHA256" != "$SIGNING_CERT_SHA256" ]; then
            echo "Signing certificate changed; refusing to publish an incompatible update." >&2
            exit 1
          fi

          TAG="internal-${VERSION_CODE}"
          gh release create "$TAG" "$APK_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION_NAME" \
            --notes "Automated internal build from $GITHUB_SHA" \
            --prerelease

          RELEASE_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          ASSET_ID="$(printf '%s' "$RELEASE_JSON" | jq -r --arg name "$APK_NAME" '.assets[] | select(.name == $name) | .id')"
          PUBLISHED_AT="$(printf '%s' "$RELEASE_JSON" | jq -r '.published_at // .created_at')"
          test -n "$ASSET_ID"
          test -n "$PUBLISHED_AT"

          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "git_sha=$GIT_SHA" >> "$GITHUB_OUTPUT"
          echo "asset_id=$ASSET_ID" >> "$GITHUB_OUTPUT"
          echo "apk_size=$APK_SIZE" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          echo "signing_cert_sha256=$SIGNING_CERT_SHA256" >> "$GITHUB_OUTPUT"
          echo "published_at=$PUBLISHED_AT" >> "$GITHUB_OUTPUT"

      - name: Update remote manifest release
        env:
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
          VERSION_NAME: ${{ steps.release.outputs.version_name }}
          GIT_SHA: ${{ steps.release.outputs.git_sha }}
          ASSET_ID: ${{ steps.release.outputs.asset_id }}
          APK_SIZE: ${{ steps.release.outputs.apk_size }}
          APK_SHA256: ${{ steps.release.outputs.apk_sha256 }}
          SIGNING_CERT_SHA256: ${{ steps.release.outputs.signing_cert_sha256 }}
          PUBLISHED_AT: ${{ steps.release.outputs.published_at }}
        run: |
          jq \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg gitSha "$GIT_SHA" \
            --arg publishedAt "$PUBLISHED_AT" \
            --argjson assetId "$ASSET_ID" \
            --argjson sizeBytes "$APK_SIZE" \
            --arg sha256 "$APK_SHA256" \
            --arg signingCertificateSha256 "$SIGNING_CERT_SHA256" \
            '.release = {
              versionCode: $versionCode,
              versionName: $versionName,
              gitSha: $gitSha,
              publishedAt: $publishedAt,
              assetId: $assetId,
              sizeBytes: $sizeBytes,
              sha256: $sha256,
              signingCertificateSha256: $signingCertificateSha256,
              mandatory: false
            }' \
            remote-config/internal/manifest.json > "$RUNNER_TEMP/manifest.json"
          mv "$RUNNER_TEMP/manifest.json" remote-config/internal/manifest.json

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add remote-config/internal/manifest.json
          git commit -m "chore: publish internal ${VERSION_NAME}" \
            || { echo "Manifest already up to date"; exit 0; }
          git push origin HEAD:main
        env:
          VERSION_NAME: ${{ steps.release.outputs.version_name }}
